        // Web Audio Synthesizer Beep
        const playBeep = (freq = 880, type = 'sine', duration = 0.2) => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                console.log("Audio play suppressed");
            }
        };

        // Format seconds to HH:MM:SS
        const formatSeconds = (totalSec) => {
            if (isNaN(totalSec) || totalSec < 0) return "00:00:00";
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = Math.floor(totalSec % 60);
            return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
        };

        const getNextSessionOpenDate = (session, now) => {
            const date = new Date(now);
            const day = date.getUTCDay();
            const targetDay = (session.id === 'sydney') ? 0 : 1; // Sydney opens Sun 22:00 UTC, others Mon
            let daysToAdd = (targetDay - day + 7) % 7;
            const openHour = Math.floor(session.openUtcSec / 3600);
            const openMin = Math.floor((session.openUtcSec % 3600) / 60);
            const openTimeToday = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(), openHour, openMin, 0));
            
            if (daysToAdd === 0 && now >= openTimeToday) {
                daysToAdd = 7;
            }
            
            return new Date(Date.UTC(
                date.getUTCFullYear(),
                date.getUTCMonth(),
                date.getUTCDate() + daysToAdd,
                openHour,
                openMin,
                0
            ));
        };

        // Calculate Market Session Status (with Weekend Guard)
        const getSessionStatus = (session, utcSeconds, isWeekend = false, now = new Date()) => {
            if (isWeekend) {
                const targetOpen = getNextSessionOpenDate(session, now);
                const openRemaining = Math.max(0, Math.floor((targetOpen.getTime() - now.getTime()) / 1000));
                return {
                    isOpen: false,
                    isLunch: false,
                    openRemaining,
                    closeRemaining: 0,
                    lunchEndRemaining: 0,
                    progress: 0
                };
            }

            let isOpen = false;
            let isLunch = false;
            let openRemaining = 0;
            let closeRemaining = 0;
            let lunchEndRemaining = 0;
            let progress = 0;

            const { openUtcSec, closeUtcSec, lunchStartUtcSec, lunchEndUtcSec } = session;

            // Session crossing midnight vs same day
            if (openUtcSec < closeUtcSec) {

                        isLunch = true;
                        lunchEndRemaining = lunchEndUtcSec - utcSeconds;
                    }
                } else {

                        openRemaining = openUtcSec - utcSeconds;
                    } else {
                        openRemaining = (86400 - utcSeconds) + openUtcSec;
                    }
                }

                        isLunch = true;
                        lunchEndRemaining = lunchEndUtcSec - utcSeconds;
                    }
                } else {
                    openRemaining = openUtcSec - utcSeconds;
                }
            }

            return { isOpen, isLunch, openRemaining, closeRemaining, lunchEndRemaining, progress };
        };

                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h3 className="font-bold text-slate-100 text-sm">{t('activeTrade')}</h3>
                                                <p className="text-xs text-slate-400">{t('targetHolding')}: {maxHoldMinutes}m</p>
                                            </div>
                                            <div className="flex items-center space-x-2">
                                                <select 
                                                    value={maxHoldMinutes} 
                                                    onChange={e => setMaxHoldMinutes(Number(e.target.value))}
                                                    className="bg-slate-950 border border-slate-800 text-slate-300 text-xs rounded-xl px-2.5 py-1 focus:outline-none"
                                                >
                                                    <option value={15}>15 min</option>
                                                    <option value={30}>30 min</option>
                                                    <option value={60}>1 hour</option>
                                                    <option value={120}>2 hours</option>
                                                    <option value={240}>4 hours</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="text-4xl font-black font-mono text-center py-2 tracking-tight text-emerald-400 bg-slate-950/60 rounded-xl border border-slate-800">
                                            {formatSeconds(tradeSeconds)}
                                        </div>

                                        <div className="flex space-x-2">
                                            {!tradeActive ? (
                                                <button 
                                                    onClick={() => setTradeActive(true)}
                                                    className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-2 transition"
                                                >
                                                    <IconPlay className="w-4 h-4" />
                                                    <span>{t('startTrade')}</span>
                                                </button>
                                            ) : (
                                                <button 
                                                    onClick={() => setTradeActive(false)}
                                                    className="flex-1 bg-rose-500 hover:bg-rose-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-2 transition"
                                                >
                                                    <IconPause className="w-4 h-4" />
                                                    <span>{t('stopTrade')}</span>
                                                </button>
                                            )}
                                            <button 
                                                onClick={() => { setTradeActive(false); setTradeSeconds(0); }}
                                                className="px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition"
                                            >
                                                <IconRotateCcw className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>

                                    {/* Post-Trade Cooloff Timer */}
                                    <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
                                        <div>
                                            <h3 className="font-bold text-slate-100 text-sm">{t('cooloffTitle')}</h3>
                                            <p className="text-xs text-slate-400">{t('cooloffSubtitle')}</p>
                                        </div>

                                        <div className={`text-4xl font-black font-mono text-center py-2 tracking-tight rounded-xl border transition ${
                                            cooloffSeconds > 0 
                                                ? 'text-amber-400 bg-amber-500/10 border-amber-500/30 animate-pulse' 
                                                : 'text-slate-400 bg-slate-950/60 border-slate-800'
                                        }`}>
                                            {formatSeconds(cooloffSeconds)}
                                        </div>

                                        <div className="flex space-x-2">
                                            <button 
                                                onClick={() => setCooloffSeconds(15 * 60)}
                                                className="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-2 transition"
                                            >
                                                <IconShieldAlert className="w-4 h-4" />
                                                <span>{t('startCooloff')}</span>
                                            </button>
                                            <button 
                                                onClick={() => setCooloffSeconds(0)}
                                                className="px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition"
                                            >
                                                {t('reset')}
                                            </button>
                                        </div>

                                        {cooloffSeconds > 0 ? (
                                            <p className="text-[11px] text-amber-400 font-bold text-center tracking-wider uppercase">
                                                ⛔ {t('cooloffActive')}
                                            </p>
                                        ) : (
                                            <p className="text-[11px] text-emerald-400 font-bold text-center tracking-wider uppercase">
                                                ✅ {t('cooloffReady')}
                                            </p>
                                        )}
                                    </div>
                                </div>
                            </section>
                        )}


                        {/* Economic News Section */}
                        {(activeTab === 'all' || activeTab === 'news') && (
                            <section className="space-y-4">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <h2 className="text-sm font-bold tracking-wider text-slate-300 uppercase flex items-center gap-2">
                                            <IconCalendar className="w-4 h-4 text-emerald-400" />
                                            {t('newsTitle')}
                                        </h2>
                                        <p className="text-xs text-slate-400">{t('newsSubtitle')}</p>
                                    </div>

                                    <div className="flex items-center space-x-2">
                                        <button 
                                            onClick={handleRefreshViaGemini}
                                            disabled={isSearchingAi}
                                            className="px-3.5 py-2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold rounded-xl text-xs flex items-center space-x-2 transition shadow-lg shadow-emerald-500/20 disabled:opacity-50"
                                        >
                                            <IconRefreshCw className={`w-3.5 h-3.5 ${isSearchingAi ? 'animate-spin' : ''}`} />
                                            <span>{t('refreshNews')}</span>
                                        </button>
                                        <button 
                                            onClick={() => setShowAddModal(true)}
                                            className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs flex items-center space-x-1.5 border border-slate-700 transition"
                                        >
                                            <IconPlus className="w-3.5 h-3.5" />
                                            <span>{t('addCustom')}</span>
                                        </button>
                                    </div>
                                </div>

                                {aiStatusMsg && (
                                    <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3 text-xs text-emerald-400 flex items-center space-x-2">
                                        <IconActivity className="w-4 h-4 animate-spin" />
                                        <span>{aiStatusMsg}</span>
                                    </div>
                                )}

                                {/* High Volatility Alert Warning */}
                                {upcomingDangerEvent && (
                                    <div className="bg-rose-500/10 border border-rose-500/30 rounded-2xl p-4 flex items-center space-x-3 text-rose-400 text-xs animate-pulse shadow-lg">
                                        <IconAlertTriangle className="w-6 h-6 flex-shrink-0" />
                                        <div>
                                            <h4 className="font-bold uppercase tracking-wider">{t('dangerTitle')}</h4>
                                            <p className="text-rose-300/80 mt-0.5">
                                                {upcomingDangerEvent.title} ({upcomingDangerEvent.currency}) - {t('dangerBody')}
                                            </p>
                                        </div>
                                    </div>
                                )}

                                {/* Filters Bar */}
                                <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3">
                                    <div className="flex items-center space-x-2 overflow-x-auto scrollbar-none py-0.5">
                                        <span className="text-xs text-slate-400 font-medium mr-1">{t('currency')}:</span>
                                        {['ALL', 'USD', 'EUR', 'GBP', 'JPY', 'AUD', 'KRW', 'MNT'].map(curr => (
                                            <button
                                                key={curr}
                                                onClick={() => setSelectedCurrency(curr)}
                                                className={`px-2.5 py-1 rounded-lg text-xs font-mono font-bold transition ${
                                                    selectedCurrency === curr 
                                                        ? 'bg-emerald-500 text-slate-950' 
                                                        : 'bg-slate-800/80 text-slate-400 hover:text-slate-200'
                                                }`}
                                            >
                                                {curr === 'ALL' ? 'ALL' : `${getCurrencyFlag(curr)} ${curr}`}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center space-x-2 w-full sm:w-auto">
                                        <div className="relative flex-1 sm:w-48">
                                            <IconSearch className="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-500" />
                                            <input 
                                                type="text"
                                                placeholder={t('searchNews')}
                                                value={searchQuery}
                                                onChange={e => setSearchQuery(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl pl-8 pr-3 py-1.5 focus:outline-none focus:border-emerald-500/50"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* Economic Events List */}
                                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                                    <div className="divide-y divide-slate-800/60">
                                        {filteredEvents.length === 0 ? (
                                            <div className="p-8 text-center text-xs text-slate-500">
                                                {t('noEvents')}
                                            </div>
                                        ) : (
                                            filteredEvents.map(event => {
                                                const { diffSec, isPast } = getEventCountdown(event);
                                                const flag = getCurrencyFlag(event.currency);

                                                return (
                                                    <div key={event.id} className="p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 hover:bg-slate-800/30 transition">
                                                        <div className="flex items-start space-x-3">
                                                            <div className="text-2xl pt-0.5">{flag}</div>
                                                            <div>
                                                                <div className="flex items-center space-x-2">
                                                                    <span className="text-xs font-mono font-bold text-slate-300">{event.currency}</span>
                                                                    <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full border ${
                                                                        event.impact === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400 border-rose-500/40' :
                                                                        event.impact === 'HIGH' ? 'bg-amber-500/20 text-amber-400 border-amber-500/40' :
                                                                        'bg-slate-800 text-slate-400 border-slate-700'
                                                                    }`}>
                                                                        {event.impact}
                                                                    </span>
                                                                    <span className="text-xs text-slate-400 font-mono">📅 {event.date} • {event.timeUtc} UTC</span>
                                                                </div>
                                                                <h4 className="font-bold text-slate-100 text-sm mt-1">{event.title}</h4>
                                                                <div className="flex items-center space-x-4 text-xs font-mono text-slate-400 mt-1">
                                                                    <span>{t('actual')}: <strong className="text-emerald-400">{event.actual || '-'}</strong></span>
                                                                    <span>{t('forecast')}: <strong className="text-slate-300">{event.forecast}</strong></span>
                                                                    <span>{t('previous')}: <strong className="text-slate-400">{event.previous}</strong></span>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center justify-end">
                                                            {isPast ? (
                                                                <span className="text-xs font-mono font-bold text-slate-500 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                                                                    ✅ {t('released')}
                                                                </span>
                                                            ) : (
                                                                <div className="text-right bg-slate-950/80 px-4 py-2 rounded-xl border border-slate-800">
                                                                    <span className="text-[10px] text-slate-400 font-mono block uppercase">COUNTDOWN</span>
                                                                    <span className="text-sm font-black font-mono text-emerald-400">
                                                                        {formatSeconds(diffSec)}
                                                                    </span>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* Custom Event Modal */}
                        {showAddModal && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                                    <h3 className="font-bold text-slate-100 text-base">{t('addCustom')}</h3>
                                    <form onSubmit={handleSaveCustomEvent} className="space-y-3 text-xs">
                                        <div>
                                            <label className="text-slate-400 block mb-1">{t('eventName')}</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={newEvent.title} 
                                                onChange={e => setNewEvent({...newEvent, title: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-xl px-3 py-2 focus:outline-none"
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-slate-400 block mb-1">{t('currency')}</label>
                                                <select 
                                                    value={newEvent.currency} 
                                                    onChange={e => setNewEvent({...newEvent, currency: e.target.value})}
                                                    className="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-xl px-3 py-2 focus:outline-none"
                                                >
                                                    {['USD', 'EUR', 'GBP', 'JPY', 'AUD', 'CAD', 'CHF', 'NZD', 'KRW', 'MNT'].map(c => (
                                                        <option key={c} value={c}>{c}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-slate-400 block mb-1">{t('impact')}</label>
                                                <select 
                                                    value={newEvent.impact} 
                                                    onChange={e => setNewEvent({...newEvent, impact: e.target.value})}
                                                    className="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-xl px-3 py-2 focus:outline-none"
                                                >
                                                    <option value="CRITICAL">CRITICAL</option>
                                                    <option value="HIGH">HIGH</option>
                                                    <option value="MEDIUM">MEDIUM</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-slate-400 block mb-1">{t('date')}</label>
                                                <input 
                                                    type="date" 
                                                    required
                                                    value={newEvent.date} 
                                                    onChange={e => setNewEvent({...newEvent, date: e.target.value})}
                                                    className="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-xl px-3 py-2 focus:outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-slate-400 block mb-1">{t('timeUtc')}</label>
                                                <input 
                                                    type="time" 
                                                    required
                                                    value={newEvent.timeUtc} 
                                                    onChange={e => setNewEvent({...newEvent, timeUtc: e.target.value})}
                                                    className="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-xl px-3 py-2 focus:outline-none"
                                                />
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-slate-400 block mb-1">{t('forecast')}</label>
                                                <input 
                                                    type="text" 
                                                    value={newEvent.forecast} 
                                                    onChange={e => setNewEvent({...newEvent, forecast: e.target.value})}
                                                    className="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-xl px-3 py-2 focus:outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-slate-400 block mb-1">{t('previous')}</label>
                                                <input 
                                                    type="text" 
                                                    value={newEvent.previous} 
                                                    onChange={e => setNewEvent({...newEvent, previous: e.target.value})}
                                                    className="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-xl px-3 py-2 focus:outline-none"
                                                />
                                            </div>
                                        </div>
                                        <div className="flex justify-end space-x-2 pt-3">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowAddModal(false)}
                                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold"
                                            >
                                                {t('cancel')}
                                            </button>
                                            <button 
                                                type="submit"
                                                className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl font-bold"
                                            >
                                                {t('saveEvent')}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        // Render Application to DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
